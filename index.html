<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Coffee Economy</title><style>
:root{font-family:system-ui,sans-serif;color:#f5efe3;background:#121b19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#25443a,#121b19 60%);min-height:100vh}main{max-width:790px;margin:auto;padding:30px 18px}h1{font-size:clamp(2rem,6vw,3.5rem);margin:8px 0}h2{margin:6px 0 12px}p{line-height:1.6;color:#c6d2cb}.eyebrow{color:#e6b879;letter-spacing:.13em;text-transform:uppercase;font-size:.78rem;font-weight:800}.card{border:1px solid #456055;background:#1c2e29;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 12px 35px #0003}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#263e35;padding:14px;border-radius:12px}.stat b{display:block;font-size:1.3rem;color:#e6b879}.stat small{color:#c6d2cb}.choices{display:grid;gap:10px}.choice{display:block;text-align:left;background:#263d35;border:1px solid #537063;color:#f5efe3;border-radius:12px;padding:15px;cursor:pointer;font:inherit}.choice:hover,.choice.selected{border-color:#f1bd72;background:#355347}.choice strong{display:block;margin-bottom:5px}.choice span{font-size:.88rem;color:#cad6cd}button.primary{background:#e6b879;color:#1b2923;border:0;padding:14px 22px;border-radius:12px;font-weight:800;cursor:pointer;font-size:1rem}button:disabled{opacity:.45;cursor:not-allowed}.muted{font-size:.85rem;color:#aebeb3}.bar{height:9px;background:#365348;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#e6b879;transition:width .2s}input[type=range]{width:100%;accent-color:#e6b879}input[type=number]{background:#243b33;color:white;border:1px solid #779085;padding:10px;border-radius:9px;width:100%}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.result{border-left:4px solid #e6b879;padding:12px 16px;background:#263c33;margin:16px 0}footer{margin-top:35px;color:#93a69b;font-size:.8rem}</style></head>
<body><main><div class="eyebrow">Interactive economics adventure</div><h1>☕ The Coffee Economy</h1><p>Build your wealth, run a central bank, rescue a commercial bank, invest, trade and discover the real value of money.</p><div class="row"><span id="progress">Level 1 of 7</span><button class="choice" style="padding:8px 12px" onclick="restart()">Restart</button></div><div class="bar"><div id="bar"></div></div><section id="app"></section><footer>Fictional economic simulation for learning, not financial advice. Progress is saved in this browser.</footer></main>
<script>
const levels=[
{title:"The Value of Time",intro:"A coffee costs 50 beans, a meal 150, and internet access 25 per hour. What hourly wage will you demand?",opts:[["100 beans","Basic wage"],["200 beans","Comfortable wage"],["500 beans","Premium wage"],["1,000 beans","Expert wage"]],out:i=>{let n=[100,200,500,1000][i];return "Your wage buys "+(n/50).toFixed(1)+" coffees per hour. A higher asking price improves potential purchasing power, but employers must be willing to pay it."}},
{title:"The Central Bank",intro:"Inflation is 8%, unemployment 12%, and the money supply is 42 billion beans. Choose a monetary policy.",opts:[["Expand money supply","More liquidity; possible additional inflation"],["Raise interest rates","Cool demand; potential job losses"],["Keep policy unchanged","Avoid a sudden policy shock; inflation may persist"]],out:i=>[ "In this scenario inflation rises to 9.5% and unemployment eases to 11.2%.", "In this scenario inflation falls to 5.5% but unemployment rises to 13%.", "In this scenario inflation eases to 7.5% and unemployment to 11.8%."][i]+" These outcomes are illustrative, not forecasts."},
{title:"Commercial Banking",intro:"Your bank has 1,000,000 beans in deposits. Loans earn 10% and deposits cost 3% annually. Choose how much to lend.",type:"slider",min:0,max:90,step:5,initial:60,out:n=>{let loan=n*10000, cash=1000000-loan, income=loan*.1-30000;return "Loans: "+fmt(loan)+" beans. Annual net interest income: "+fmt(income)+" beans (before losses and costs). After a 300,000-bean withdrawal, "+(cash>=300000?"you retain "+fmt(cash-300000)+" liquid beans.":"you face a "+fmt(300000-cash)+"-bean liquidity shortfall.")}},
{title:"The Banking Panic",intro:"After the first withdrawal, your bank has 100,000 liquid beans. Customers demand another 250,000. How will you fill the 150,000 gap?",opts:[["Borrow from the central bank","150,000 beans at 12% interest"],["Sell performing loans","Sell 200,000 of loans at a 15% discount"],["Attract new depositors","Offer 9% interest; uncertain demand"],["Raise emergency equity","200,000 beans for 30% ownership"]],out:i=>["The bank covers the gap, but owes 18,000 beans in annual emergency-loan interest.","You raise 170,000 beans and recognize a 30,000-bean sale loss.","In this scenario you attract only 70,000 new beans, leaving an 80,000-bean shortfall. Seek additional funding.","Investors accept. The bank pays withdrawals, retains 50,000 liquid beans, and existing owners keep 70% ownership."][i]},
{title:"The Investment Portfolio",intro:"Allocate 300,000 beans across farming, AI, government bonds and coffee shops. One-year scenario returns are +14%, −8%, +6%, +15%.",type:"portfolio",out:a=>{let amounts=a.map(x=>x*3000),rates=[.14,-.08,.06,.15],gain=amounts.reduce((s,x,i)=>s+x*rates[i],0);return "Your one-year gain is "+fmt(gain)+" beans; ending value "+fmt(300000+gain)+". At 6.5% inflation, your real return is "+(((300000+gain)/300000/1.065-1)*100).toFixed(1)+"%. Diversification does not eliminate risk."}},
{title:"International Trade",intro:"One coffee bean buys 2 Wheat Coins. Each imported machine costs 40,000 Wheat Coins. Your development budget is 100,000 beans.",opts:[["Import four machines","Costs 80,000 beans at today's rate"],["Export coffee","Sell 50,000 beans for 100,000 Wheat Coins"],["Develop domestic manufacturing","Invest 100,000 beans locally"],["Hold foreign reserves","Convert 100,000 beans to 200,000 Wheat Coins"]],out:i=>["Machines arrive and support farm productivity, but imports become costlier if the bean weakens.","Export receipts increase, but commodity prices and currency movements remain risks.","Local production supports skilled jobs, but development may take longer than planned.","Foreign currency reserves help fund future imports, but exchange rates can move against you."][i]},
{title:"Purchasing Power Parity",intro:"A cup of coffee costs 50 beans at home and 80 Wheat Coins abroad. The market exchange rate is 2 Wheat Coins per bean. What does the coffee price comparison suggest?",opts:[["The bean is undervalued","Foreign coffee is more expensive after conversion"],["The bean is overvalued","Foreign coffee is cheaper after conversion"],["Prices are identical","The currencies have equal purchasing power"]],out:i=>{return (i===1?"Correct! ":"Let's calculate: ")+"Foreign coffee costs 80 ÷ 2 = 40 beans, versus 50 beans at home. The coffee-implied PPP rate is 80 ÷ 50 = 1.6 Wheat Coins per bean, compared with the market rate of 2. This simple coffee index suggests the bean is stronger than its coffee-based PPP benchmark. Real PPP comparisons need broader baskets of goods."}}
];
const fmt=n=>Math.round(n).toLocaleString("en-US");let saved;try{saved=JSON.parse(localStorage.getItem("coffeeEconomySave"))}catch{}let state=saved&&Number.isInteger(saved.level)?saved:{level:0,history:[]};state.level=Math.max(0,Math.min(7,state.level));let selection=0,slider=60,allocation=[5,35,40,20];function persist(){localStorage.setItem("coffeeEconomySave",JSON.stringify(state))}function restart(){if(confirm("Start a new game?")){state={level:0,history:[]};persist();render()}}function choose(i){selection=i;document.querySelectorAll(".choice[data-choice]").forEach(b=>b.classList.toggle("selected",+b.dataset.choice===i))}function changeAlloc(i,v){allocation[i]=+v;renderPortfolio()}function renderPortfolio(){let names=["Farming","Banking Tech & AI","Government Bonds","Coffee Shops"];document.getElementById("inputs").innerHTML=names.map((n,i)=>'<div style="margin:14px 0"><div class="row"><strong>'+n+'</strong><span>'+allocation[i]+'% · '+fmt(allocation[i]*3000)+' beans</span></div><input aria-label="'+n+' allocation" type="range" min="0" max="100" step="5" value="'+allocation[i]+'" oninput="changeAlloc('+i+',this.value)"></div>').join("");let total=allocation.reduce((a,b)=>a+b,0);document.getElementById("allocInfo").textContent="Total allocated: "+total+"% (must equal 100%)";document.getElementById("next").disabled=total!==100}function finish(){let l=levels[state.level],answer=l.type==="slider"?slider:l.type==="portfolio"?[...allocation]:selection;state.history.push({title:l.title,result:l.out(answer)});state.level++;persist();render()}function render(){let app=document.getElementById("app");document.getElementById("progress").textContent="Level "+Math.min(state.level+1,7)+" of 7";document.getElementById("bar").style.width=(state.level/7*100)+"%";if(state.level===7){app.innerHTML='<div class="card"><h2>🏆 Coffee Economy Graduate!</h2><p>You completed all seven challenges. Review your decisions and try a different economic strategy.</p>'+state.history.map((x,i)=>'<div class="result"><strong>Level '+(i+1)+': '+x.title+'</strong><p>'+x.result+'</p></div>').join('')+'<button class="primary" onclick="restart()">Play again</button></div>';return}let l=levels[state.level];selection=0;slider=l.initial||60;let prior=state.history.length?'<div class="result"><strong>Previous outcome</strong><p>'+state.history.at(-1).result+'</p></div>':"";app.innerHTML=prior+'<div class="card"><div class="eyebrow">Round '+(state.level+1)+'</div><h2>'+l.title+'</h2><p>'+l.intro+'</p><div id="inputs"></div><p id="allocInfo" class="muted"></p><button id="next" class="primary" onclick="finish()">Confirm decision →</button></div>';if(l.opts){document.getElementById("inputs").innerHTML='<div class="choices">'+l.opts.map((o,i)=>'<button class="choice '+(i===0?"selected":"")+'" data-choice="'+i+'" onclick="choose('+i+')"><strong>'+o[0]+'</strong><span>'+o[1]+'</span></button>').join("")+'</div>'}else if(l.type==="slider"){document.getElementById("inputs").innerHTML='<div class="row"><strong>Loan allocation</strong><strong id="value">'+slider+'%</strong></div><input aria-label="Loan allocation" type="range" min="'+l.min+'" max="'+l.max+'" step="'+l.step+'" value="'+slider+'" oninput="slider=+this.value;document.getElementById(\'value\').textContent=slider+\'%\'">'}else if(l.type==="portfolio")renderPortfolio()}render();
</script></body></html>
